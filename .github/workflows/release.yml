name: Release signed APK

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must match vX.Y.Z (for example, v1.2.3)."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore release signing files
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "The RELEASE_KEYSTORE_BASE64 secret is not configured."
            exit 1
          fi

          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          cat > keystore/signing.gradle <<'EOF'
          android {
              signingConfigs {
                  sms {
                      storeFile file(System.getenv("SIGNING_STORE_FILE"))
                      storePassword System.getenv("SIGNING_STORE_PASSWORD")
                      keyAlias System.getenv("SIGNING_KEY_ALIAS")
                      keyPassword System.getenv("SIGNING_KEY_PASSWORD")
                  }
              }
          }
          EOF

      - name: Test and build signed release APK
        env:
          RELEASE_VERSION_NAME: ${{ github.ref_name }}
          SIGNING_STORE_FILE: ${{ runner.temp }}/release.keystore
          SIGNING_STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          export RELEASE_VERSION_NAME="${RELEASE_VERSION_NAME#v}"

          for variable in SIGNING_STORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD; do
            if [[ -z "${!variable}" ]]; then
              echo "The release signing secret for $variable is not configured."
              exit 1
            fi
          done

          ./gradlew :app:testDebugUnitTest :app:assembleRelease

      - name: Prepare release asset
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          apk_path="app/build/outputs/apk/release/app-release.apk"
          asset_path="$RUNNER_TEMP/SMSScheduler-${RELEASE_TAG}.apk"

          test -f "$apk_path"
          cp "$apk_path" "$asset_path"
          echo "RELEASE_ASSET=$asset_path" >> "$GITHUB_ENV"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            "$RELEASE_ASSET#SMSScheduler-${RELEASE_TAG}.apk" \
            --verify-tag \
            --generate-notes \
            --title "$RELEASE_TAG"
